[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logiscout-logger"
version = "0.1.1"
description = "Python logging library for ingesting logs into LogiScout"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Abdur Rehman Kazim", email = "abdurrehmankazim68@gmail.com"}
]
keywords = [
    "logiscout",
    "logging",
    "structured-logging",
    "observability",
    "log-ingestion",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "structlog>=24.0.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/Kazim68/logiscout-logger"
Documentation = "https://github.com/Kazim68/logiscout-logger"
Repository = "https://github.com/Kazim68/logiscout-logger"
Issues = "https://github.com/Kazim68/logiscout-logger/issues"

[tool.hatch.build.targets.wheel]
packages = ["logiscout_logger"]

[tool.hatch.build.targets.sdist]
include = [
    "/logiscout_logger",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "*.pyc",
    "__pycache__",
    ".git",
    ".venv",
    "venv",
    "tests",
    ".pytest_cache",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
